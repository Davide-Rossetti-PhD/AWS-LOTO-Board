<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOTO Board v2.0 — SITE-001 [CLOUD]</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--bg:#f0f2f5;--card:#fff;--text:#172b4d;--text2:#44546f;--muted:#8993a4;--border:#e0e0e0;--blight:#ebecf0;--accent:#0052CC;--danger:#c62828;--success:#2e7d32;--warn:#ff991f;--sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;--mono:'Consolas','SF Mono',monospace;--r:10px;--rs:6px;--rp:100px;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);font-family:var(--sans);color:var(--text);padding:16px;min-height:100vh;}

/* ── HEADER ── */
.header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;margin-bottom:16px;background:var(--card);border:1px solid var(--border);border-radius:12px;}
.header-left{display:flex;align-items:center;gap:12px;}
.header h1{font-size:20px;font-weight:700;} .header h1 i{color:var(--danger);margin-right:4px;}
.site-badge{background:var(--danger);color:#fff;font-size:12px;font-weight:700;padding:3px 10px;border-radius:var(--rp);}
.live-dot{width:8px;height:8px;background:#36b37e;border-radius:50%;display:inline-block;animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.header-right{display:flex;align-items:center;gap:14px;}
.clock{font-family:var(--mono);font-size:16px;font-weight:600;}

/* ── KPI ── */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;display:flex;align-items:center;gap:12px;}
.kpi-card{cursor:pointer;transition:all .15s;}.kpi-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.1);transform:translateY(-1px);}.kpi-card.active-filter{border-color:var(--accent);box-shadow:0 0 0 2px rgba(0,82,204,.25);}
.kpi-icon{width:40px;height:40px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;flex-shrink:0;}
.kpi-icon.total{background:var(--accent);} .kpi-icon.inuse{background:var(--danger);} .kpi-icon.free{background:var(--success);} .kpi-icon.alert{background:var(--warn);}
.kpi-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
.kpi-value{font-family:var(--mono);font-size:26px;font-weight:700;line-height:1.1;}

/* ── VIEW TABS ── */
.view-tabs{display:flex;gap:4px;margin-bottom:16px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:4px;width:fit-content;}
.view-tab{padding:8px 20px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--text2);transition:all .15s;}
.view-tab:hover{background:#f4f5f7;} .view-tab.active{background:var(--accent);color:#fff;} .view-tab i{margin-right:6px;}
.view-panel{display:none;} .view-panel.active{display:block;}

/* ── DASHBOARD ── */
.cat-tabs{display:flex;gap:6px;margin-bottom:14px;}
.cat-tab{padding:6px 14px;border-radius:var(--rp);font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--text2);transition:all .15s;}
.cat-tab:hover{background:#f4f5f7;} .cat-tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-bottom:20px;}
.lock-tile{border-radius:8px;padding:10px 8px;text-align:center;border:2px solid transparent;position:relative;transition:transform .1s;cursor:default;}
.lock-tile:hover{transform:scale(1.03);}
.lock-tile .lock-name{font-size:15px;font-weight:700;font-family:var(--mono);margin-bottom:3px;}
.lock-tile .lock-status{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;}
.lock-tile .lock-user{font-size:10px;margin-top:3px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lock-tile .lock-time{font-size:9px;margin-top:2px;opacity:.7;font-family:var(--mono);}
.lock-tile.free{background:#e8f5e9;border-color:#c8e6c9;color:#2e7d32;}
.lock-tile.inuse-A{background:#ffcdd2;border-color:#ef9a9a;color:#b71c1c;}
.lock-tile.inuse-S{background:#bbdefb;border-color:#90caf9;color:#0d47a1;}
.lock-tile.inuse-C{background:#fff9c4;border-color:#fff176;color:#f57f17;}
.lock-tile.alert-tile{border-color:var(--danger)!important;animation:alertPulse 1.5s infinite;}
@keyframes alertPulse{0%,100%{box-shadow:0 0 0 0 rgba(198,40,40,.3)}50%{box-shadow:0 0 0 5px rgba(198,40,40,0)}}
.lock-tile .alert-badge{position:absolute;top:-5px;right:-5px;background:var(--danger);color:#fff;font-size:8px;font-weight:700;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.alert-banner{background:#fff3e0;border:1px solid #ffe0b2;border-left:4px solid var(--warn);border-radius:8px;padding:10px 16px;margin-bottom:10px;display:flex;align-items:center;gap:10px;font-size:12px;}
.alert-banner i{color:var(--warn);font-size:16px;} .alert-banner strong{color:var(--danger);}
.alert-box{background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin-bottom:14px;overflow:hidden;}.alert-box-header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;cursor:pointer;background:#fff3e0;border-bottom:1px solid #ffe0b2;user-select:none;}.alert-box-header:hover{background:#ffecb3;}.alert-box-header .alert-title{font-size:13px;font-weight:700;color:var(--danger);display:flex;align-items:center;gap:8px;}.alert-box-header .alert-toggle{font-size:12px;color:var(--muted);transition:transform .2s;}.alert-box-body{max-height:300px;overflow-y:auto;transition:max-height .3s ease;}.alert-box-body.collapsed{max-height:0;overflow:hidden;}

/* ── CHECK-IN / OUT ── */
.cio-container{max-width:620px;margin:0 auto;}
.mode-toggle{display:flex;gap:0;margin-bottom:20px;border-radius:var(--r);overflow:hidden;border:2px solid var(--accent);}
.mode-btn{flex:1;padding:14px;text-align:center;font-size:15px;font-weight:700;cursor:pointer;border:none;background:var(--card);color:var(--accent);transition:all .15s;}
.mode-btn.active{background:var(--accent);color:#fff;}
.mode-btn:hover:not(.active){background:#e3f2fd;}
.sheet-selector{text-align:center;margin-bottom:20px;}
.sheet-selector p{font-size:13px;color:var(--text2);margin-bottom:12px;font-weight:600;}
.sheet-buttons{display:flex;gap:10px;justify-content:center;}
.sheet-btn{flex:1;max-width:180px;padding:20px 12px;border-radius:12px;border:3px solid var(--border);background:var(--card);font-size:15px;font-weight:700;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:6px;}
.sheet-btn:hover{transform:scale(1.03);box-shadow:0 2px 8px rgba(0,0,0,.08);}
.sheet-btn.red{color:#b71c1c;} .sheet-btn.red.sel{background:#ffcdd2;border-color:#c62828;}
.sheet-btn.blue{color:#0d47a1;} .sheet-btn.blue.sel{background:#bbdefb;border-color:#1565c0;}
.sheet-btn.yellow{color:#f57f17;} .sheet-btn.yellow.sel{background:#fff9c4;border-color:#f9a825;}
.sheet-btn .sheet-icon{font-size:28px;}
.cio-fields{margin-top:4px;}
.cio-group{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;margin-bottom:12px;}
.cio-group h3{font-size:12px;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.cio-group h3 .step-num{background:var(--accent);color:#fff;width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;}
.cio-input{width:100%;padding:12px 14px;border-radius:var(--rs);border:2px solid var(--border);font-size:16px;font-family:var(--mono);font-weight:600;outline:none;transition:border-color .15s;}
.cio-input:focus{border-color:var(--accent);}
.cio-select{width:100%;padding:12px 14px;border-radius:var(--rs);border:2px solid var(--border);font-size:14px;font-family:var(--mono);font-weight:600;outline:none;background:var(--card);transition:border-color .15s;}
.cio-select:focus{border-color:var(--accent);}
.cio-detect{margin-top:6px;font-size:12px;min-height:18px;font-weight:600;}
.cio-detect.found{color:var(--success);} .cio-detect.notfound{color:var(--danger);}
.btn-submit{width:100%;padding:16px;border-radius:var(--r);border:none;font-size:16px;font-weight:700;cursor:pointer;color:#fff;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .15s;}
.btn-submit.ci{background:var(--danger);} .btn-submit.ci:hover{background:#b71c1c;}
.btn-submit.co{background:var(--success);} .btn-submit.co:hover{background:#1b5e20;}
.btn-submit:disabled{opacity:.5;cursor:not-allowed;}
.cio-flash{padding:14px 18px;border-radius:var(--r);margin-top:14px;font-weight:600;font-size:14px;display:none;text-align:center;}
.cio-flash.ok{display:block;background:#c8e6c9;color:#1b5e20;} .cio-flash.err{display:block;background:#ffcdd2;color:#b71c1c;}

/* ── HISTORY ── */
.hist-tabs{display:flex;gap:6px;margin-bottom:14px;}
.hist-tab{padding:8px 18px;border-radius:var(--rp);font-size:13px;font-weight:700;cursor:pointer;border:2px solid transparent;transition:all .15s;background:var(--card);}
.hist-tab.a-tab{color:#b71c1c;border-color:#ffcdd2;background:#ffebee;} .hist-tab.a-tab.active{background:#c62828;color:#fff;border-color:#c62828;}
.hist-tab.b-tab{color:#0d47a1;border-color:#bbdefb;background:#e3f2fd;} .hist-tab.b-tab.active{background:#1565c0;color:#fff;border-color:#1565c0;}
.hist-tab.c-tab{color:#f57f17;border-color:#fff9c4;background:#fffde7;} .hist-tab.c-tab.active{background:#f9a825;color:#fff;border-color:#f9a825;}
.storico-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.storico-toolbar label{font-size:12px;font-weight:600;color:var(--text2);}
.storico-toolbar select,.storico-toolbar input{padding:6px 10px;border-radius:var(--rs);border:1px solid var(--border);font-size:12px;background:var(--card);color:var(--text);}
.storico-toolbar .search-box{width:200px;}
.btn-download{margin-left:auto;padding:8px 16px;border-radius:8px;border:none;background:var(--success);color:#fff;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;}
.btn-download:hover{background:#1b5e20;}
.storico-table-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow-x:auto;overflow-y:auto;}
.storico-table{width:100%;border-collapse:collapse;font-size:12px;}
.storico-table{min-width:900px;}
.storico-table thead{background:#f4f5f7;position:sticky;top:0;z-index:1;}
.storico-table th{padding:10px 12px;text-align:left;font-weight:700;font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.03em;cursor:pointer;user-select:none;white-space:nowrap;border-bottom:2px solid var(--border);}
.storico-table th:hover{background:#ebedf0;}
.storico-table td{padding:8px 12px;border-bottom:1px solid var(--blight);}
.storico-table tbody tr:hover{background:#e3f2fd;}
.storico-table tbody tr:nth-child(even){background:#f8f9fa;}
.storico-table tbody tr:nth-child(even):hover{background:#e3f2fd;}
.storico-table .active-row{background:#fff8e1!important;} .storico-table .active-row:hover{background:#fff3c4!important;}
.cat-badge{display:inline-block;padding:1px 6px;border-radius:var(--rp);font-size:9px;font-weight:700;}
.cat-badge.A{background:#ffcdd2;color:#b71c1c;} .cat-badge.S{background:#bbdefb;color:#0d47a1;} .cat-badge.C{background:#fff9c4;color:#f57f17;}
.pagination{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;font-size:12px;color:var(--text2);}
.pagination button{padding:4px 12px;border-radius:var(--rs);border:1px solid var(--border);background:var(--card);font-size:12px;cursor:pointer;color:var(--text);}
.pagination button:hover{background:#f4f5f7;} .pagination button:disabled{opacity:.4;cursor:not-allowed;}

/* ── ADMIN ── */
.admin-section{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;margin-bottom:16px;}
.admin-section h3{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.admin-section h3 i{color:var(--accent);}
.admin-section h3 .badge-count{background:var(--accent);color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:var(--rp);}
.admin-form{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:flex-end;}
.admin-form .field{display:flex;flex-direction:column;gap:3px;}
.admin-form .field label{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;}
.admin-form .field input,.admin-form .field select{padding:7px 10px;border-radius:var(--rs);border:1px solid var(--border);font-size:13px;background:var(--card);color:var(--text);}
.admin-form .field input:focus,.admin-form .field select:focus{border-color:var(--accent);outline:none;}
.btn-admin{padding:7px 14px;border-radius:var(--rs);border:none;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:4px;}
.btn-admin.add{background:var(--accent);color:#fff;} .btn-admin.add:hover{background:#003d99;}
.admin-list{max-height:280px;overflow-y:auto;}
.admin-list table{width:100%;border-collapse:collapse;font-size:12px;}
.admin-list th{padding:8px 10px;text-align:left;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;background:#f4f5f7;border-bottom:2px solid var(--border);position:sticky;top:0;}
.admin-list td{padding:6px 10px;border-bottom:1px solid var(--blight);}
.admin-list tr:hover{background:#e3f2fd;}
.admin-list .active-yes{color:var(--success);font-weight:600;} .admin-list .active-no{color:var(--danger);font-weight:600;}
.btn-row{display:flex;gap:4px;}
.btn-sm{padding:3px 8px;border-radius:4px;border:none;font-size:10px;font-weight:600;cursor:pointer;}
.btn-sm.edit{background:#e3f2fd;color:var(--accent);} .btn-sm.edit:hover{background:#bbdefb;}
.btn-sm.del{background:#ffebee;color:var(--danger);} .btn-sm.del:hover{background:#ffcdd2;}
.btn-sm.toggle{background:#fff3e0;color:#e65100;} .btn-sm.toggle:hover{background:#ffe0b2;}
.admin-flash{padding:8px 14px;border-radius:var(--rs);margin-bottom:10px;font-size:12px;font-weight:600;display:none;}
.admin-flash.ok{display:block;background:#c8e6c9;color:#1b5e20;} .admin-flash.err{display:block;background:#ffcdd2;color:#b71c1c;}
.admin-pw-status{display:inline-flex;align-items:center;gap:6px;margin-left:10px;font-size:12px;font-weight:600;padding:4px 12px;border-radius:var(--rp);}.admin-pw-status.ok{background:#c8e6c9;color:#1b5e20;}.admin-pw-status.wrong{background:#ffcdd2;color:#b71c1c;}.admin-pw-status.none{display:none;}.btn-logout{padding:5px 14px;border-radius:var(--rs);border:1px solid var(--danger);background:#fff;color:var(--danger);font-size:12px;font-weight:600;cursor:pointer;display:none;margin-left:8px;}.btn-logout:hover{background:#ffebee;}

@media(max-width:768px){.kpi-row{grid-template-columns:repeat(2,1fr)}.board{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}.storico-toolbar{flex-direction:column;align-items:stretch}.btn-download{margin-left:0}.sheet-buttons{flex-direction:column;align-items:center;}}
</style>
</head>
<body>

<!-- ══════ HEADER ══════ -->
<div class="header">
    <div class="header-left">
        <h1><i class="fa-solid fa-lock"></i> Digital LOTO Board</h1>
        <span class="site-badge" id="site-badge">SITE-001</span>
        <span class="live-dot" id="live-dot"></span>
        <span id="status-text" style="font-size:11px;color:var(--muted)">Connecting...</span>
    </div>
    <div class="header-right">
        <span id="clock" class="clock">--:--:--</span>
        <span id="date-display" style="font-size:11px;color:var(--text2)"></span>
    </div>
</div>

<!-- ══════ VIEW TABS ══════ -->
<div class="view-tabs">
    <button class="view-tab active" data-view="dashboard"><i class="fa-solid fa-grip"></i>Live Dashboard</button>
    <button class="view-tab" data-view="checkinout"><i class="fa-solid fa-barcode"></i>Check-in / Out</button>
    <button class="view-tab" data-view="storico"><i class="fa-solid fa-clock-rotate-left"></i>Operation History</button>
    <button class="view-tab" data-view="admin"><i class="fa-solid fa-gear"></i>Admin Config</button>
</div>

<!-- ══════ VIEW 1: DASHBOARD ══════ -->
<div id="view-dashboard" class="view-panel active">
    <div class="kpi-row">
        <div class="kpi-card active-filter" data-kpifilter="all" onclick="setKpiFilter('all')"><div class="kpi-icon total"><i class="fa-solid fa-key"></i></div><div><div class="kpi-label">Total</div><div class="kpi-value" id="kpi-total">--</div></div></div>
        <div class="kpi-card" data-kpifilter="inuse" onclick="setKpiFilter('inuse')"><div class="kpi-icon inuse"><i class="fa-solid fa-lock"></i></div><div><div class="kpi-label">In Use</div><div class="kpi-value" id="kpi-inuse">--</div></div></div>
        <div class="kpi-card" data-kpifilter="free" onclick="setKpiFilter('free')"><div class="kpi-icon free"><i class="fa-solid fa-lock-open"></i></div><div><div class="kpi-label">Available</div><div class="kpi-value" id="kpi-free">--</div></div></div>
        <div class="kpi-card" data-kpifilter="alert" onclick="setKpiFilter('alert')"><div class="kpi-icon alert"><i class="fa-solid fa-triangle-exclamation"></i></div><div><div class="kpi-label">Alerts &gt;10h</div><div class="kpi-value" id="kpi-alert">--</div></div></div>
    </div>
    <div id="alert-area" style="display:none"><div class="alert-box"><div class="alert-box-header" onclick="toggleAlerts()"><span class="alert-title"><i class="fa-solid fa-triangle-exclamation"></i> <span id="alert-title-text">0 Alerts</span></span><span class="alert-toggle" id="alert-toggle-icon"><i class="fa-solid fa-chevron-down"></i></span></div><div class="alert-box-body" id="alert-box-body"></div></div></div>
    <div class="cat-tabs" id="cat-tabs">
        <div class="cat-tab active" data-cat="all">All</div>
        <div class="cat-tab" data-cat="A">A</div>
        <div class="cat-tab" data-cat="B">S</div>
        <div class="cat-tab" data-cat="C">C</div>
    </div>
    <div class="board" id="board-grid"></div>
</div>

<!-- ══════ VIEW 2: CHECK-IN / CHECK-OUT ══════ -->
<div id="view-checkinout" class="view-panel">
    <div class="cio-container">
        <div class="mode-toggle">
            <button class="mode-btn active" id="mode-ci" onclick="setCioMode('checkin')"><i class="fa-solid fa-lock"></i> CHECK-IN (Take Lock)</button>
            <button class="mode-btn" id="mode-co" onclick="setCioMode('checkout')"><i class="fa-solid fa-lock-open"></i> CHECK-OUT (Return Lock)</button>
        </div>
        <div class="sheet-selector">
            <p><i class="fa-solid fa-file-lines"></i> Select LOTO Sheet Type</p>
            <div class="sheet-buttons">
                <button class="sheet-btn red" onclick="selectSheet('A')"><span class="sheet-icon">🔴</span>Red (A)</button>
                <button class="sheet-btn blue" onclick="selectSheet('B')"><span class="sheet-icon">🔵</span>Blue (B)</button>
                <button class="sheet-btn yellow" onclick="selectSheet('C')"><span class="sheet-icon">🟡</span>Yellow (C)</button>
            </div>
        </div>
        <div id="cio-fields" class="cio-fields"></div>
        <button class="btn-submit ci" id="cio-submit" style="display:none" onclick="submitCio()"><i class="fa-solid fa-lock"></i> CONFIRM CHECK-IN</button>
        <div class="cio-flash" id="cio-flash"></div>
    </div>
</div>

<!-- ══════ VIEW 3: OPERATION HISTORY ══════ -->
<div id="view-storico" class="view-panel">
    <div class="hist-tabs">
        <button class="hist-tab a-tab active" data-type="A"><i class="fa-solid fa-circle" style="font-size:9px;color:#c62828"></i> Red (A) Log</button>
        <button class="hist-tab b-tab" data-type="B"><i class="fa-solid fa-circle" style="font-size:9px;color:#1565c0"></i> Blue (B) Log</button>
        <button class="hist-tab c-tab" data-type="C"><i class="fa-solid fa-circle" style="font-size:9px;color:#f9a825"></i> Yellow (C) Log</button>
    </div>
    <div class="storico-toolbar">
        <label>Month:</label>
        <select id="filter-month"></select>
        <input type="text" class="search-box" id="filter-search" placeholder="&#x1F50D; Search...">
        <button class="btn-download" id="btn-export"><i class="fa-solid fa-file-csv"></i> Download CSV</button>
    </div>
    <div class="storico-table-wrap" style="max-height:550px;overflow-y:auto">
        <table class="storico-table">
            <thead id="storico-head"></thead>
            <tbody id="storico-body"></tbody>
        </table>
    </div>
    <div class="pagination">
        <span id="storico-count">0 results</span>
        <div>
            <button id="page-prev" disabled>&laquo; Previous</button>

function buildDemoLocks(){
    var now=new Date();
    return ALL_LOCKS.map(function(l){
        var ci=demoCheckins[l];
        if(ci){
            var elapsed=(now-new Date(ci.checkin_time))/3600000;
            return{lock_number:l,status:"checked_in",category:getCat(l),user:ci.user||"",equipment:ci.equipment||"",reason:ci.reason||"",hours_elapsed:elapsed,alert:elapsed>=CONFIG.ALERT_H,checkin_time:ci.checkin_time,contractor_company:ci.contractor_company||"",contractor_employee:ci.contractor_employee||""};
        }
        return{lock_number:l,status:"free",category:getCat(l)};
    });
}
function getDemoLocks(){
    var locks=buildDemoLocks();var inUse=locks.filter(function(l){return l.status==="checked_in"}).length;
    var alerts=locks.filter(function(l){return l.alert}).length;
    return Promise.resolve({server_time:new Date().toISOString(),total:locks.length,in_use:inUse,free:locks.length-inUse,alerts:alerts,locks:locks});
}
function getDemoAdminList(ct){var e=demoAdmin[ct]||[];return Promise.resolve({config_type:ct,count:e.length,entries:e});}
function demoAdminWrite(action,ct,key,value,active){
    if(!demoAdmin[ct])demoAdmin[ct]=[];var list=demoAdmin[ct];
    if(action==="add"){if(list.find(function(e){return e.key===key}))return{error:"Already exists"};list.push({key:key,value:value||key,active:active!==false});}
    else if(action==="update"){var it=list.find(function(e){return e.key===key});if(!it)return{error:"Not found"};if(value)it.value=value;it.active=active;}
    else if(action==="delete"){var idx=list.findIndex(function(e){return e.key===key});if(idx===-1)return{error:"Not found"};list.splice(idx,1);}
    return{status:"ok",message:action+" successful (DEMO)"};
}

<script>

// ══════════════════════════════════════
//  DASHBOARD

var locksData=[],activeCat="all",activeKpiFilter="all";
function fmtDur(h){var hh=Math.floor(h),mm=Math.round((h-hh)*60);return hh>0?hh+"h "+mm+"m":mm+"m";}
function setKpiFilter(f){
    activeKpiFilter=f;
    document.querySelectorAll(".kpi-card").forEach(function(c){c.classList.remove("active-filter")});
    document.querySelector('.kpi-card[data-kpifilter="'+f+'"]').classList.add("active-filter");
    renderDashboard();
}
function renderDashboard(){
    var grid=document.getElementById("board-grid"),aArea=document.getElementById("alert-area");
    grid.innerHTML="";
    var filtered=activeCat==="all"?locksData:locksData.filter(function(l){return l.category===activeCat});
    // Apply KPI filter
    if(activeKpiFilter==="inuse")filtered=filtered.filter(function(l){return l.status==="checked_in"});
    else if(activeKpiFilter==="free")filtered=filtered.filter(function(l){return l.status==="free"});
    else if(activeKpiFilter==="alert")filtered=filtered.filter(function(l){return l.alert});
    var alerts=[];
    filtered.forEach(function(lk){
        var t=document.createElement("div");t.className="lock-tile";
        if(lk.status==="checked_in"){
            t.classList.add("inuse-"+lk.category);
            if(lk.alert){t.classList.add("alert-tile");alerts.push(lk);t.innerHTML='<div class="alert-badge">!</div>';}
            var who=lk.user||lk.contractor_company||"";
            t.innerHTML+='<div class="lock-name">'+lk.lock_number+'</div><div class="lock-status"><i class="fa-solid fa-lock" style="font-size:9px"></i> IN USE</div><div class="lock-user"><i class="fa-solid fa-user" style="font-size:8px"></i> '+who+'</div><div class="lock-time">'+fmtDur(lk.hours_elapsed||0)+'</div>';
            t.title=lk.lock_number+"\nUser: "+who+"\nEquipment: "+(lk.equipment||"")+"\nReason: "+(lk.reason||"")+"\nElapsed: "+fmtDur(lk.hours_elapsed||0);
        }else{
            t.classList.add("free");
            t.innerHTML='<div class="lock-name">'+lk.lock_number+'</div><div class="lock-status"><i class="fa-solid fa-lock-open" style="font-size:9px"></i> FREE</div>';
        }
        grid.appendChild(t);
    });
    var alertBody=document.getElementById("alert-box-body");
    if(alerts.length>0){
        aArea.style.display="block";
        document.getElementById("alert-title-text").textContent=alerts.length+" Alert"+(alerts.length>1?"s":"")+" (>"+CONFIG.ALERT_H+"h)";
        alertBody.innerHTML=alerts.map(function(a){var who=a.user||a.contractor_company||"";return'<div class="alert-banner"><i class="fa-solid fa-triangle-exclamation"></i><div><strong>'+a.lock_number+'</strong> in use for <strong>'+fmtDur(a.hours_elapsed)+'</strong> &#8212; '+who+' @ '+(a.equipment||"")+'</div></div>';}).join("");
    }else{
        aArea.style.display="none";
    }
}
function updateKPIs(d){document.getElementById("kpi-total").textContent=d.total||"--";document.getElementById("kpi-inuse").textContent=d.in_use||0;document.getElementById("kpi-free").textContent=d.free||0;document.getElementById("kpi-alert").textContent=d.alerts||0;}
// In LIVE mode, rebuild the in-memory demoCheckins + ALL_LOCKS from the real
// backend state so the check-in/check-out form (which validates client-side)
// keeps working exactly as in DEMO — just backed by DynamoDB.
function hydrateFromLive(d){
    var locks=d.locks||[];
    var ci={};
    var all=[];
    locks.forEach(function(l){
        all.push(l.lock_number);
        if(l.status==="checked_in"){
            ci[l.lock_number]={
                user:l.user||"",
                contractor_company:l.contractor_company||"",
                equipment:l.equipment||"",
                reason:l.reason||"",
                checkin_time:l.checkin_time||""
            };
        }
    });
    if(all.length){ALL_LOCKS=all;}
    demoCheckins=ci;
}
async function pollLocks(){
    try{
        var d=DEMO?await getDemoLocks():await apiFetch("/locks");
        if(!DEMO)hydrateFromLive(d);
        locksData=d.locks||[];updateKPIs(d);renderDashboard();
        document.getElementById("live-dot").style.background="#36b37e";

}

                html+='<div class="cio-group"><h3><span class="step-num">2</span><i class="fa-solid fa-id-badge"></i> Badge — Authorized Associate Removing Lockout (scan barcode)</h3>';

        if(lockInput){

            var v=this.value.trim(),det=document.getElementById("cio-co-badge-det");

            det.textContent=login?"Resolved: "+login:"Badge not recognized";
            det.className="cio-detect "+(login?"found":"notfound");

function getActiveLocksForType(type){
    var result=[];
    var catPrefix=type;
    Object.keys(demoCheckins).forEach(function(lockNum){
        if(getCat(lockNum)===catPrefix){
            result.push(Object.assign({lock_number:lockNum},demoCheckins[lockNum]));
        }
    });
    result.sort(function(a,b){return a.lock_number.localeCompare(b.lock_number)});
    return result;
}

function validateLockInput(){
    var v=document.getElementById("cio-lock").value.trim().toUpperCase();
    var det=document.getElementById("cio-lock-det");
    if(!v){det.textContent="";return;}
    if(ALL_LOCKS.indexOf(v)<0){det.textContent="Lock not found: "+v;det.className="cio-detect notfound";return;}
    var cat=getCat(v);
    if(cat!==selectedSheet){
        var names={A:"Red (A)",S:"Blue (B)",C:"Yellow (C)"};
        det.textContent="Lock "+v+" is "+names[cat]+", but you selected "+names[selectedSheet]+" sheet";
        det.className="cio-detect notfound";return;
    }
    if(demoCheckins[v]){det.textContent="Lock "+v+" is already in use";det.className="cio-detect notfound";return;}
    det.textContent="✓ "+v+" — Available";det.className="cio-detect found";
}

function validateBadgeInput(){
    var v=document.getElementById("cio-badge").value.trim();
    var det=document.getElementById("cio-badge-det");
    if(!v){det.textContent="";return;}
    var login=resolveBadge(v);
    det.textContent=login?"Resolved: "+login:"Badge not recognized";
    det.className="cio-detect "+(login?"found":"notfound");
}

function showFlash(msg,type){var el=document.getElementById("cio-flash");el.textContent=msg;el.className="cio-flash "+(type==="ok"?"ok":"err");}

async function submitCio(){
    if(!selectedSheet){showFlash("Select a sheet type first","err");return;}
    var isYellow=selectedSheet==="C";
    var now=new Date();
    var btn=document.getElementById("cio-submit");

    if(cioMode==="checkin"){
        // ── VALIDATE CHECK-IN ──
        var lockNum=(document.getElementById("cio-lock").value||"").trim().toUpperCase();
        if(!lockNum){showFlash("Lock number is required","err");return;}
        if(ALL_LOCKS.indexOf(lockNum)<0){showFlash("Lock '"+lockNum+"' not found in the system","err");return;}
        if(getCat(lockNum)!==selectedSheet){showFlash("Lock "+lockNum+" does not belong to "+selectedSheet+" sheet","err");return;}
        if(demoCheckins[lockNum]){showFlash("Lock "+lockNum+" is already in use","err");return;}

        var equipment=(document.getElementById("cio-equipment").value||"").trim();
        if(!equipment){showFlash("Equipment Being Locked Out is required","err");return;}

        var reason=(document.getElementById("cio-reason").value||"").trim();
        if(!reason){showFlash("Reason for Lockout is required","err");return;}

        var company="",badge="",login="";
        if(isYellow){
            company=(document.getElementById("cio-company").value||"").trim();
            if(!company){showFlash("Contractor Company is required","err");return;}
        }else{
            badge=(document.getElementById("cio-badge").value||"").trim();
            if(!badge){showFlash("Badge is required for "+selectedSheet+" locks","err");return;}
            login=resolveBadge(badge);
            if(!login){showFlash("Badge '"+badge+"' not recognized — add in Admin Config","err");return;}
        }

        if(DEMO){
            var logRecord={lock_number:lockNum,category:selectedSheet,equipment:equipment,checkin_time:now.toISOString(),reason:reason,checkout_time:""};
            var checkinRecord={equipment:equipment,reason:reason,checkin_time:now.toISOString()};
            if(isYellow){logRecord.contractor_company=company;logRecord.contractor_employee="";checkinRecord.contractor_company=company;}
            else{logRecord.user_in=login;logRecord.user_out="";checkinRecord.user=login;}
            demoCheckins[lockNum]=checkinRecord;
            demoLog.unshift(logRecord);
            showFlash("✓ CHECK-IN complete: "+lockNum+" — "+(isYellow?company:login),"ok");
        }else{
            // ── LIVE: POST /checkin ──
            var body={lock_number:lockNum,equipment:equipment,reason:reason};
            if(isYellow)body.contractor_company=company;else body.badge_id=badge;
            try{
                if(btn)btn.disabled=true;
                await apiFetch("/checkin",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
                showFlash("✓ CHECK-IN complete: "+lockNum+" — "+(isYellow?company:login),"ok");
            }catch(e){showFlash(e.message,"err");if(btn)btn.disabled=false;return;}
            if(btn)btn.disabled=false;
        }

    }else{
        // ── VALIDATE CHECK-OUT ──
        var sel=document.getElementById("cio-lock-select");
        if(!sel){showFlash("No locks available to check out","err");return;}
        var lockNum=sel.value;
        if(!lockNum){showFlash("Select a lock to return","err");return;}
        var ci=demoCheckins[lockNum];
        if(!ci){showFlash("Lock "+lockNum+" is not in use","err");return;}

        var dur=Math.round((now-new Date(ci.checkin_time))/60000);
        var employee="",badge="",login="";

        if(isYellow){
            employee=(document.getElementById("cio-co-employee").value||"").trim();
            if(!employee){showFlash("Contractor Employee name is required","err");return;}
        }else{
            badge=(document.getElementById("cio-co-badge").value||"").trim();
            if(!badge){showFlash("Badge is required","err");return;}
            login=resolveBadge(badge);
            if(!login){showFlash("Badge '"+badge+"' not recognized","err");return;}
            // Must be the same person who checked in — RED only (Blue/Transitional allows different associate)
            if(selectedSheet==="A" && ci.user && login!==ci.user){showFlash("Lock was checked in by "+ci.user+" — only they can check it out (you scanned: "+login+")","err");return;}
        }

        if(DEMO){
            if(isYellow){
                var rec=demoLog.find(function(r){return r.lock_number===lockNum&&!r.checkout_time&&r.category==="C"});
                if(rec){rec.contractor_employee=employee;rec.checkout_time=now.toISOString();}
            }else{
                var rec=demoLog.find(function(r){return r.lock_number===lockNum&&!r.checkout_time&&(r.category==="A"||r.category==="B")});
                if(rec){rec.user_out=login;rec.checkout_time=now.toISOString();}
            }
            delete demoCheckins[lockNum];
            var hh=Math.floor(dur/60),mm=dur%60;
            showFlash("✓ CHECK-OUT complete: "+lockNum+" ("+hh+"h "+mm+"m)","ok");
        }else{
            // ── LIVE: POST /checkout ──
            var body={lock:lockNum};
            if(isYellow)body.contractor_employee=employee;else body.badge=badge;
            try{
                if(btn)btn.disabled=true;
                var res=await apiFetch("/checkout",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
                var disp=res&&res.duration_display?res.duration_display:"";
                showFlash("✓ CHECK-OUT complete: "+lockNum+(disp?" ("+disp+")":""),"ok");
            }catch(e){showFlash(e.message,"err");if(btn)btn.disabled=false;return;}
            if(btn)btn.disabled=false;
        }
    }

    // Refresh dashboard + history
    pollLocks();
    if(storicoLoaded)refreshHistory(true);

    // Reset after 1.5s
    setTimeout(function(){
        selectedSheet="";
        document.querySelectorAll(".sheet-btn").forEach(function(b){b.classList.remove("sel")});
        document.getElementById("cio-fields").innerHTML="";
        document.getElementById("cio-submit").style.display="none";
        document.getElementById("cio-flash").className="cio-flash";
    },1500);
}

var histType="A",histPage=0,PAGE_SZ=50,histSortCol="checkin_time",histSortDir="desc";

// Column definitions per Appendix A
var COLS_AB=[
    {key:"lock_number",label:"Lock Number"},
    {key:"equipment",label:"Equipment Being Locked Out"},
    {key:"user_in",label:"Authorized Associate (login) Performing Lockout"},
    {key:"checkin_time",label:"Lockout Start Date/Time",fmt:"ts"},
    {key:"reason",label:"Reason for Lockout"},
    {key:"user_out",label:"Authorized Associate (login) Removing Lockout"},
    {key:"checkout_time",label:"Lockout Removal Date/Time",fmt:"ts"}
];
var COLS_C=[
    {key:"lock_number",label:"Lock Number"},
    {key:"equipment",label:"Equipment Being Locked Out"},
    {key:"contractor_company",label:"Contractor Company"},
    {key:"checkin_time",label:"Lockout Start Date/Time",fmt:"ts"},
    {key:"reason",label:"Reason for Lockout"},
    {key:"contractor_employee",label:"Contractor Employee who is using the lock"},
    {key:"checkout_time",label:"Lockout Removal Date/Time",fmt:"ts"}
];

function getColsForType(t){return t==="C"?COLS_C:COLS_AB;}

// ── HISTORY DATA SOURCE ──────────────────────────────────────────────
// In DEMO we read the in-memory demoLog. In LIVE we fetch raw history rows
// from GET /history and pair check_in/check_out records into one row per
// lockout cycle (same pairing the server-side Excel export does).
var liveLog=[];               // paired rows for the current histType (LIVE)
var liveLogType=null;         // which type liveLog currently holds
function histSource(){return DEMO?demoLog:liveLog;}

// Pair raw backend history records (separate check_in / check_out rows)
// into cycle rows compatible with the demoLog shape.
function pairHistoryRecords(records,type){
    var isYellow=(type==="C");
    var checkins=[],checkouts=[];
    records.forEach(function(r){
        // check_out rows carry checkout_time; check_in rows don't.
        if(r.checkout_time)checkouts.push(r);else checkins.push(r);
    });
    // Key completed cycles by (lock_number, checkin_time) so we can drop the
    // matching check_in row that the check_out already represents.
    var completed={};
    var rows=[];
    checkouts.forEach(function(r){
        var key=r.lock_number+"|"+(r.checkin_time||"");
        if(r.checkin_time)completed[key]=true;
        rows.push({
            lock_number:r.lock_number||"",category:type,
            equipment:r.equipment||"",reason:r.reason||"",
            checkin_time:r.checkin_time||"",checkout_time:r.checkout_time||"",
            user_in:r.user_in||"",user_out:r.user_out||"",
            contractor_company:r.contractor_company||"",
            contractor_employee:r.contractor_employee||""
        });
    });
    checkins.forEach(function(r){
        var key=r.lock_number+"|"+(r.checkin_time||"");
        if(completed[key])return;   // already covered by a check_out row
        rows.push({
            lock_number:r.lock_number||"",category:type,
            equipment:r.equipment||"",reason:r.reason||"",
            checkin_time:r.checkin_time||"",checkout_time:"",
            user_in:r.user_in||"",user_out:"",
            contractor_company:r.contractor_company||"",
            contractor_employee:isYellow?"":(r.contractor_employee||"")
        });
    });
    return rows;
}

// Fetch + pair history for the active type (LIVE only). Pulls a large page
// so client-side filtering/sorting/paging keeps behaving like DEMO.
async function loadHistoryLive(type){
    var d=await apiFetch("/history?type="+encodeURIComponent(type)+"&page=1&page_size=500&sort_by=checkin_time&sort_dir=desc");
    liveLog=pairHistoryRecords(d.records||[],type);
    liveLogType=type;
}

function fmtTs(s){if(!s)return"";try{var d=new Date(s);return d.toLocaleDateString("en-GB",{day:"2-digit",month:"2-digit",year:"numeric"})+" "+d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});}catch(e){return s;}}

function initMonthFilter(){
    var sel=document.getElementById("filter-month"),now=new Date();
    var opt0=document.createElement("option");opt0.value="";opt0.textContent="All months";sel.appendChild(opt0);
    for(var i=0;i<12;i++){var d=new Date(now.getFullYear(),now.getMonth()-i,1);var val=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");var lbl=d.toLocaleDateString("en-GB",{month:"long",year:"numeric"});var opt=document.createElement("option");opt.value=val;opt.textContent=lbl.charAt(0).toUpperCase()+lbl.slice(1);sel.appendChild(opt);}
}

// Load (LIVE: fetch+pair) then render the history table.
// force=true re-fetches even if the type hasn't changed (e.g. after check-in/out).
async function refreshHistory(force){
    if(!DEMO){
        try{
            if(force||liveLogType!==histType)await loadHistoryLive(histType);
        }catch(e){
            console.error(e);
            document.getElementById("storico-body").innerHTML='<tr><td colspan="7" style="text-align:center;padding:20px;color:var(--danger)">Error loading history: '+e.message+'</td></tr>';
            return;
        }
    }
    renderHistory();
}

// Sub-tab switching
document.querySelectorAll(".hist-tab").forEach(function(tab){
    tab.addEventListener("click",function(){
        document.querySelectorAll(".hist-tab").forEach(function(t){t.classList.remove("active")});
        tab.classList.add("active");
        histType=tab.dataset.type;histPage=0;histSortCol="checkin_time";histSortDir="desc";
        refreshHistory();
    });
});

function getFilteredLog(){
    var month=document.getElementById("filter-month").value;
    var search=document.getElementById("filter-search").value.toLowerCase().trim();
    var cols=getColsForType(histType);
    var filtered=histSource().filter(function(r){return r.category===histType});
    // Compare month in LOCAL time (not UTC) to match the filter dropdown
    if(month){filtered=filtered.filter(function(r){function localYM(ts){if(!ts)return"";var d=new Date(ts);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");}return localYM(r.checkin_time)===month||localYM(r.checkout_time)===month;});}
    if(search){filtered=filtered.filter(function(r){return cols.some(function(c){return((r[c.key]||"")+"").toLowerCase().indexOf(search)>=0})});}
    // Sort
    filtered.sort(function(a,b){
        var va=a[histSortCol]||"",vb=b[histSortCol]||"";
        if(va<vb)return histSortDir==="asc"?-1:1;
        if(va>vb)return histSortDir==="asc"?1:-1;return 0;
    });
    return filtered;
}

function renderHistory(){
    var cols=getColsForType(histType);
    // Render header
    var head=document.getElementById("storico-head");
    head.innerHTML="<tr>"+cols.map(function(c){
        var arrow=histSortCol===c.key?(histSortDir==="asc"?" ▲":" ▼"):"";
        return'<th data-sort="'+c.key+'" style="cursor:pointer">'+c.label+arrow+'</th>';
    }).join("")+"</tr>";
    // Attach sort listeners
    head.querySelectorAll("th[data-sort]").forEach(function(th){
        th.addEventListener("click",function(){
            var col=th.dataset.sort;
            if(histSortCol===col)histSortDir=histSortDir==="asc"?"desc":"asc";
            else{histSortCol=col;histSortDir="desc";}
            renderHistory();
        });
    });

    var filtered=getFilteredLog();
    var total=filtered.length,start=histPage*PAGE_SZ,items=filtered.slice(start,start+PAGE_SZ);
    document.getElementById("storico-count").textContent=total+" records";
    document.getElementById("page-info").textContent="Page "+(histPage+1)+" of "+Math.max(1,Math.ceil(total/PAGE_SZ));
    document.getElementById("page-prev").disabled=histPage===0;
    document.getElementById("page-next").disabled=start+PAGE_SZ>=total;

    var body=document.getElementById("storico-body");
    if(!items.length){body.innerHTML='<tr><td colspan="'+cols.length+'" style="text-align:center;padding:20px;color:var(--muted)">No records</td></tr>';return;}

    body.innerHTML=items.map(function(r){
        var isActive=!r.checkout_time;
        return'<tr class="'+(isActive?"active-row":"")+'">'+cols.map(function(c){
            var val=r[c.key]||"";
            if(c.fmt==="ts")val=fmtTs(val);
            if(c.key==="lock_number")val="<strong>"+val+"</strong>";
            if(isActive&&(c.key==="user_out"||c.key==="contractor_employee"||c.key==="checkout_time"))val=val?val:'<span style="color:var(--warn);font-style:italic">⏳ Active</span>';
            return"<td>"+val+"</td>";
        }).join("")+"</tr>";
    }).join("");
}

// Toolbar events
document.getElementById("filter-month").addEventListener("change",function(){histPage=0;renderHistory();});
document.getElementById("filter-search").addEventListener("input",function(){histPage=0;renderHistory();});
document.getElementById("page-prev").addEventListener("click",function(){histPage--;renderHistory();});
document.getElementById("page-next").addEventListener("click",function(){histPage++;renderHistory();});

// ── EXPORT DOWNLOAD ──
// DEMO: build a CSV client-side from the in-memory log.
// LIVE: download the styled XLSX generated by the /export Lambda.
function triggerDownload(url,filename){
    var a=document.createElement("a");
    a.href=url;a.download=filename;a.style.cssText="position:fixed;left:-9999px";
    document.body.appendChild(a);a.click();
    setTimeout(function(){document.body.removeChild(a)},150);
}
function exportCsvDemo(){
    var cols=getColsForType(histType);
    var filtered=getFilteredLog();
    if(!filtered.length){alert("No records to export for this sheet type.");return;}
    var names={A:"Red_A",B:"Blue_B",C:"Yellow_C"};
    // Build CSV
    var csvRows=[cols.map(function(c){return'"'+c.label.replace(/"/g,'""')+'"'}).join(",")];
    filtered.forEach(function(r){
        csvRows.push(cols.map(function(c){
            var val=r[c.key]||"";
            if(c.fmt==="ts")val=fmtTs(val);
            return'"'+(val+"").replace(/"/g,'""')+'"';
        }).join(","));
    });
    var csv=csvRows.join("\r\n");
    var filename="LOTO_Log_"+names[histType]+"_"+new Date().toISOString().slice(0,10)+".csv";
    var bom="\uFEFF",encoded=encodeURIComponent(bom+csv);
    triggerDownload("data:text/csv;charset=utf-8,"+encoded,filename);
}
async function exportXlsxLive(btn){
    // Respect the current sheet type + month/search filters.
    var month=document.getElementById("filter-month").value||"";
    var search=(document.getElementById("filter-search").value||"").trim();
    var qs="?type="+encodeURIComponent(histType);
    if(month)qs+="&month="+encodeURIComponent(month);
    if(search)qs+="&search="+encodeURIComponent(search);
    var oldTxt=btn?btn.innerHTML:"";
    try{
        if(btn){btn.disabled=true;btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Exporting...';}
        var resp=await fetch(CONFIG.API_URL+"/export"+qs,{
            headers:{"x-api-key":CONFIG.API_KEY,
                "Accept":"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}
        });
        if(!resp.ok){
            var msg="HTTP "+resp.status;
            try{var j=await resp.json();if(j&&j.error)msg=j.error;}catch(e){}
            throw new Error(msg);
        }
        var blob=await resp.blob();
        var names={A:"Red_A",B:"Blue_B",C:"Yellow_C"};
        var filename="LOTO_Log_"+(names[histType]||histType)+"_"+new Date().toISOString().slice(0,10)+".xlsx";
        var objUrl=URL.createObjectURL(blob);
        triggerDownload(objUrl,filename);
        setTimeout(function(){URL.revokeObjectURL(objUrl)},2000);
    }catch(e){
        alert("Export failed: "+e.message);
    }finally{
        if(btn){btn.disabled=false;btn.innerHTML=oldTxt;}
    }
}
document.getElementById("btn-export").addEventListener("click",function(e){
    e.preventDefault();
    if(DEMO)exportCsvDemo();else exportXlsxLive(this);
});

    }
}
function adminLogout(){
    adminLoggedIn=false;
    document.getElementById("admin-pw").value="";document.getElementById("admin-pw").disabled=false;
    document.getElementById("admin-pw-status").className="admin-pw-status none";
    document.getElementById("btn-admin-login").style.display="";document.getElementById("btn-admin-logout").style.display="none";
    document.getElementById("admin-pw-hint").textContent="Required for adding, editing, and deleting. Not needed for viewing.";
    showAdmFlash("Logged out","ok");
}
function showAdmFlash(msg,type){var el=document.getElementById("admin-flash");el.textContent=msg;el.className="admin-flash "+(type==="ok"?"ok":"err");setTimeout(function(){el.className="admin-flash"},4000);}
async function adminApi(body){
    if(DEMO){var r=demoAdminWrite(body.action,body.config_type,body.config_key,body.value,body.active);if(r.error)throw new Error(r.error);if(r.message)showAdmFlash(r.message,"ok");return r;}
    // Map frontend field names to what the admin_config Lambda expects:
    //   config_key   -> key
    //   admin_password -> password
    var payload={action:body.action,config_type:body.config_type};
    if(body.config_key!==undefined)payload.key=body.config_key;
    if(body.value!==undefined)payload.value=body.value;
    if(body.active!==undefined)payload.active=body.active;
    if(body.admin_password!==undefined)payload.password=body.admin_password;
    return await apiFetch("/admin/config",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
}
async function loadAdmSec(ct,listId,cntId,renderFn){
    try{var d=DEMO?await getDemoAdminList(ct):await adminApi({action:"list",config_type:ct});document.getElementById(cntId).textContent=d.count||0;document.getElementById(listId).innerHTML=renderFn(d.entries||[]);}
    catch(e){document.getElementById(listId).innerHTML='<p style="color:var(--danger);font-size:12px">Error: '+e.message+'</p>';}
}
function renderOpTbl(entries){if(!entries.length)return'<p style="color:var(--muted);font-size:12px">No operators</p>';return'<table><thead><tr><th>Badge</th><th>Login</th><th>Active</th><th></th></tr></thead><tbody>'+entries.map(function(e){return'<tr><td><code>'+e.key+'</code></td><td><strong>'+e.value+'</strong></td><td class="'+(e.active?'active-yes':'active-no')+'">'+(e.active?'Yes':'No')+'</td><td class="btn-row"><button class="btn-sm toggle" onclick="admToggle(\'badge_map\',\''+e.key+'\','+!e.active+')">'+(e.active?'Disable':'Enable')+'</button><button class="btn-sm del" onclick="admDel(\'badge_map\',\''+e.key+'\')"><i class="fa-solid fa-trash"></i></button></td></tr>';}).join('')+'</tbody></table>';}
function renderLkTbl(entries){if(!entries.length)return'<p style="color:var(--muted);font-size:12px">No locks</p>';return'<table><thead><tr><th>Lock</th><th>Cat</th><th>Active</th><th></th></tr></thead><tbody>'+entries.map(function(e){return'<tr><td><strong>'+e.key+'</strong></td><td><span class="cat-badge '+e.value+'">'+e.value+'</span></td><td class="'+(e.active?'active-yes':'active-no')+'">'+(e.active?'Yes':'No')+'</td><td class="btn-row"><button class="btn-sm toggle" onclick="admToggle(\'lock_list\',\''+e.key+'\','+!e.active+')">'+(e.active?'Disable':'Enable')+'</button><button class="btn-sm del" onclick="admDel(\'lock_list\',\''+e.key+'\')"><i class="fa-solid fa-trash"></i></button></td></tr>';}).join('')+'</tbody></table>';}
function renderSimTbl(ct,entries){if(!entries.length)return'<p style="color:var(--muted);font-size:12px">None configured — add above</p>';return'<table><thead><tr><th>Name</th><th>Active</th><th></th></tr></thead><tbody>'+entries.map(function(e){var ek=e.key.replace(/'/g,"\\'");return'<tr><td>'+e.key+'</td><td class="'+(e.active?'active-yes':'active-no')+'">'+(e.active?'Yes':'No')+'</td><td class="btn-row"><button class="btn-sm toggle" onclick="admToggle(\''+ct+'\',\''+ek+'\','+!e.active+')">'+(e.active?'Disable':'Enable')+'</button><button class="btn-sm del" onclick="admDel(\''+ct+'\',\''+ek+'\')"><i class="fa-solid fa-trash"></i></button></td></tr>';}).join('')+'</tbody></table>';}
async function loadAllAdmin(){adminLoaded=true;await Promise.all([loadAdmSec("badge_map","op-list","op-count",renderOpTbl),loadAdmSec("lock_list","lock-list","lock-count",renderLkTbl),loadAdmSec("locations","loc-list","loc-count",function(e){return renderSimTbl("locations",e)}),loadAdmSec("reasons","reason-list","reason-count",function(e){return renderSimTbl("reasons",e)}),loadAdmSec("contractors","contr-list","contr-count",function(e){return renderSimTbl("contractors",e)})]);}
async function adminAdd(ct,kId,vId){if(!reqPw())return;var k=document.getElementById(kId).value.trim(),v=document.getElementById(vId).value?document.getElementById(vId).value.trim():"";if(!k||(vId&&!v)){showAdmFlash("Both fields required","err");return;}try{await adminApi({action:"add",config_type:ct,config_key:k,value:v,admin_password:getPw()});showAdmFlash("Added "+k,"ok");document.getElementById(kId).value="";if(vId)document.getElementById(vId).value="";loadAllAdmin();}catch(e){showAdmFlash(e.message,"err");}}
async function adminAddSimple(ct,nId){if(!reqPw())return;var n=document.getElementById(nId).value.trim();if(!n){showAdmFlash("Name required","err");return;}try{await adminApi({action:"add",config_type:ct,config_key:n,value:n,admin_password:getPw()});showAdmFlash("Added '"+n+"'","ok");document.getElementById(nId).value="";loadAllAdmin();}catch(e){showAdmFlash(e.message,"err");}}
async function admToggle(ct,key,active){if(!reqPw())return;try{await adminApi({action:"update",config_type:ct,config_key:key,active:active,admin_password:getPw()});showAdmFlash(key+(active?" enabled":" disabled"),"ok");loadAllAdmin();}catch(e){showAdmFlash(e.message,"err");}}
async function admDel(ct,key){if(!reqPw())return;if(!confirm("Delete '"+key+"'?"))return;try{await adminApi({action:"delete",config_type:ct,config_key:key,admin_password:getPw()});showAdmFlash("Deleted '"+key+"'","ok");loadAllAdmin();}catch(e){showAdmFlash(e.message,"err");}}

// ══════════════════════════════════════
document.getElementById("site-badge").textContent=CONFIG.SITE;
initMonthFilter();
pollLocks();
setInterval(pollLocks,CONFIG.POLL_MS);
</script>
